<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wacom Native Input Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Wacom Native Input Monitor</h1>
      <p>Wacom 네이티브 터치와 펜 원시 데이터를 플랫폼 공통 localhost 브리지에서 직접 표시합니다.</p>
    </div>
    <div class="actions">
      <button id="clearButton" type="button">지우기 (C)</button>
      <button id="fullscreenButton" type="button">전체 화면 (F)</button>
    </div>
  </header>

  <main>
    <section id="inputArea" aria-label="입력 테스트 영역">
      <canvas id="canvas"></canvas>
      <div class="empty-state" id="emptyState">
        <strong>장치에 입력해 보세요</strong>
        <span>네이티브 브리지의 터치·펜·호버 데이터를 표시합니다.</span>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i class="dot mouse"></i>마우스</span>
        <span><i class="dot touch"></i>터치</span>
        <span><i class="dot touch-untrusted"></i>터치(신뢰도 낮음)</span>
        <span><i class="dot pen"></i>펜</span>
        <span><i class="ring"></i>호버</span>
      </div>
    </section>

    <aside>
      <section class="summary" aria-label="입력 요약">
        <div><span>활성 입력</span><strong id="pointerCount">0</strong></div>
        <div><span>현재 터치</span><strong id="touchCount">0</strong></div>
        <div><span>최대 동시 터치</span><strong id="maxTouchCount">0</strong></div>
        <div><span>수신 이벤트</span><strong id="eventCount">0</strong></div>
      </section>

      <section class="support" id="supportStatus" aria-label="브리지 연결 상태"></section>

      <section class="pointer-list-section">
        <div class="section-title"><h2>네이티브 입력 데이터</h2><span>실시간</span></div>
        <div id="pointerList" class="pointer-list">
          <p class="no-pointers">감지된 입력이 없습니다.</p>
        </div>
      </section>

      <section class="event-section">
        <div class="section-title"><h2>최근 이벤트</h2><span>최신 12개</span></div>
        <ol id="eventLog" class="event-log"></ol>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
